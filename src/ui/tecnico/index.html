<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#090a0c" />
    <title>SPCam</title>
    <!-- Aplica el tema guardado antes de pintar (evita el parpadeo). Oscuro por defecto. -->
    <script>
      try {
        if (localStorage.getItem('spcam.tema') === 'claro') document.documentElement.classList.remove('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="mapa"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
